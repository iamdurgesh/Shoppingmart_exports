<footer class="site-footer">
  <div class="footer-main">
    <div class="footer-brand">
      <app-brand-logo background="light" />
      <p>{{ 'footer.copy' | transloco }}</p>
    </div>

    <div class="footer-contact">
      <h2>{{ 'footer.contact' | transloco }}</h2>
      <a href="mailto:global.sales@shoppingmartexports.com">
        global.sales&#64;shoppingmartexports.com
      </a>
    </div>

    <div class="footer-social">
      <h2>{{ 'footer.follow' | transloco }}</h2>
      <div class="social-links">
        <a
          class="social-link"
          href="https://www.linkedin.com/company/shopping-mart-exports/"
          target="_blank"
          rel="noopener noreferrer"
          [attr.aria-label]="'footer.linkedin' | transloco"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6.5 8.25H3V21h3.5V8.25ZM4.75 3A2.05 2.05 0 1 0 4.75 7.1 2.05 2.05 0 0 0 4.75 3ZM21 13.7c0-3.84-2.05-5.63-4.79-5.63a4.14 4.14 0 0 0-3.75 2.06V8.25H9V21h3.46v-6.31c0-1.66.32-3.28 2.39-3.28 2.04 0 2.06 1.91 2.06 3.39V21H21v-7.3Z" />
          </svg>
        </a>

        <a
          class="social-link"
          href="https://wa.me/918178188168"
          target="_blank"
          rel="noopener noreferrer"
          [attr.aria-label]="'footer.whatsapp' | transloco"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20.52 3.48A11.8 11.8 0 0 0 1.96 17.7L.3 23.78l6.22-1.63A11.79 11.79 0 0 0 12.16 23h.01A11.83 11.83 0 0 0 20.52 3.48Zm-8.35 17.53h-.01a9.8 9.8 0 0 1-5-1.37l-.36-.22-3.69.97.98-3.6-.23-.37A9.8 9.8 0 1 1 12.17 21Zm5.38-7.34c-.3-.15-1.75-.86-2.02-.96-.27-.1-.47-.15-.66.15-.2.3-.76.96-.93 1.16-.17.2-.34.22-.64.07-.3-.15-1.25-.46-2.38-1.47a8.94 8.94 0 0 1-1.65-2.05c-.17-.3-.02-.46.13-.6.13-.13.3-.35.44-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.03-.52-.07-.15-.66-1.6-.91-2.19-.24-.57-.48-.49-.66-.5H7.98c-.2 0-.52.07-.79.37-.27.3-1.03 1.01-1.03 2.46s1.06 2.86 1.2 3.05c.15.2 2.08 3.18 5.04 4.46.7.3 1.25.49 1.68.62.7.22 1.35.19 1.86.11.57-.08 1.75-.71 2-1.4.24-.68.24-1.27.17-1.39-.07-.12-.27-.2-.56-.34Z" />
          </svg>
        </a>

      </div>
    </div>
  </div>

  <div class="footer-bottom">
    <p>&copy; {{ currentYear }} Shoppingmart Exports. {{ 'footer.rights' | transloco }}</p>
    <nav [attr.aria-label]="'footer.legalNavigation' | transloco">
      <a routerLink="/privacy-policy">{{ 'footer.privacyPolicy' | transloco }}</a>
    </nav>
  </div>
</footer>

<button
  class="scroll-to-top"
  type="button"
  [class.is-visible]="isScrollToTopVisible"
  [attr.aria-hidden]="!isScrollToTopVisible"
  [attr.tabindex]="isScrollToTopVisible ? 0 : -1"
  [attr.aria-label]="'footer.backToTop' | transloco"
  (click)="scrollToTop()"
>
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="m6.7 14.7 5.3-5.3 5.3 5.3" />
  </svg>
</button>
