<header class="site-header" [class.is-scrolled]="isScrolled" [class.is-open]="isMenuOpen">
  <a class="brand" routerLink="/" [attr.aria-label]="'nav.homeAria' | transloco" (click)="closeMenu()">
    <app-brand-logo [background]="isScrolled || isMenuOpen ? 'light' : 'dark'" />
  </a>

  <button
    class="menu-button"
    type="button"
    [attr.aria-expanded]="isMenuOpen"
    aria-controls="site-nav"
    (click)="toggleMenu()"
  >
    <span></span>
    <span></span>
    <span></span>
    <span class="sr-only">{{ 'nav.open' | transloco }}</span>
  </button>

  <nav class="site-nav" id="site-nav" [class.is-open]="isMenuOpen">
    @for (item of navItems; track item.labelKey) {
      <a
        [routerLink]="item.routerLink"
        [fragment]="item.fragment"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: item.routerLink === '/compliance' }"
        (click)="closeMenu()"
      >
        {{ item.labelKey | transloco }}
      </a>
    }
    <div class="language-switcher" [class.is-open]="isLanguageMenuOpen">
      <button
        class="language-select-trigger"
        type="button"
        aria-haspopup="listbox"
        [attr.aria-expanded]="isLanguageMenuOpen"
        aria-controls="language-menu"
        [attr.aria-label]="'language.label' | transloco"
        (click)="toggleLanguageMenu($event)"
      >
        <span class="language-flag">{{ activeLanguageOption().flag }}</span>
        <span class="language-code">{{ activeLanguageOption().shortLabel }}</span>
        <span class="language-chevron"></span>
      </button>

      <div class="language-menu" id="language-menu" role="listbox" [attr.aria-label]="'language.label' | transloco">
        @for (language of languages; track language.code) {
          <button
            class="language-option"
            type="button"
            role="option"
            [class.is-active]="activeLanguage() === language.code"
            [attr.aria-selected]="activeLanguage() === language.code"
            (click)="selectLanguage(language.code)"
          >
            <span class="language-flag">{{ language.flag }}</span>
            <span class="language-code">{{ language.shortLabel }}</span>
          </button>
        }
      </div>
    </div>
  </nav>
</header>
